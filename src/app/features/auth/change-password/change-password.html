<div class="change-password-page">
  <div class="card">

    <h2>Change Password</h2>
    <p class="subtitle">Update your account password securely</p>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <label>Old Password</label>
      <input type="password" formControlName="oldPassword" />

      <label>New Password</label>
      <input type="password" formControlName="newPassword" />

      <!-- PASSWORD RULES -->
      <div class="password-rules" *ngIf="form.get('newPassword')?.touched">

        <p [class.valid]="isRuleValid('minLength')" [class.invalid]="!isRuleValid('minLength')">
          • At least 8 characters
        </p>
        <p [class.valid]="isRuleValid('uppercase')" [class.invalid]="!isRuleValid('uppercase')">
          • One uppercase letter
        </p>
        <p [class.valid]="isRuleValid('lowercase')" [class.invalid]="!isRuleValid('lowercase')">
          • One lowercase letter
        </p>
        <p [class.valid]="isRuleValid('number')" [class.invalid]="!isRuleValid('number')">
          • One number
        </p>
        <p [class.valid]="isRuleValid('special')" [class.invalid]="!isRuleValid('special')">
          • One special character
        </p>
        <p [class.valid]="isRuleValid('noSpace')" [class.invalid]="!isRuleValid('noSpace')">
          • No spaces
        </p>

      </div>

      <label>Confirm New Password</label>
      <input type="password" formControlName="confirmPassword" />

      <button class="btn-primary" type="submit" [disabled]="isLoading || form.invalid">
        {{ isLoading ? 'Updating...' : 'Change Password' }}
      </button>

      <div *ngIf="message" class="message" [ngClass]="messageType">
        {{ message }}
      </div>

    </form>

  </div>
</div>
