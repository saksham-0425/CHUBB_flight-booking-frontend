<header class="navbar">
  <div class="logo">✈ AeroFlux</div>

  <nav>
    <a routerLink="/">Home</a>
    <a routerLink="/flights">Flights</a>

    <a routerLink="/support">Support</a>
  </nav>

</header>

<section class="auth-hero">

  <div class="auth-left">
    <div class="auth-card">

      <h2>Create Account</h2>
      <p class="subtitle">Join and start booking flights</p>

      <form [formGroup]="registerForm" (ngSubmit)="submit()">

        <label>Name</label>
        <input type="text" formControlName="name" placeholder="Your full name" />

        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />

        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Create a password" />

        <!-- PASSWORD RULES -->
        <div class="password-rules" *ngIf="registerForm.get('password')?.touched">

          <p [class.valid]="isRuleValid('minLength')" 
   [class.invalid]="!isRuleValid('minLength')">
  • At least 8 characters
</p>

<p [class.valid]="isRuleValid('uppercase')" 
   [class.invalid]="!isRuleValid('uppercase')">
  • One uppercase letter
</p>

<p [class.valid]="isRuleValid('lowercase')" 
   [class.invalid]="!isRuleValid('lowercase')">
  • One lowercase letter
</p>

<p [class.valid]="isRuleValid('number')" 
   [class.invalid]="!isRuleValid('number')">
  • One number
</p>

<p [class.valid]="isRuleValid('special')" 
   [class.invalid]="!isRuleValid('special')">
  • One special character
</p>

<p [class.valid]="isRuleValid('noSpace')" 
   [class.invalid]="!isRuleValid('noSpace')">
  • No spaces
</p>

        </div>

        <button type="submit" class="btn-primary full-width" [disabled]="registerForm.invalid">
          Register
        </button>



      </form>

      <p class="switch-auth">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>

    </div>
  </div>

</section>
