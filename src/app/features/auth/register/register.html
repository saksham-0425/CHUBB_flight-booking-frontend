<header class="navbar">
  <div class="logo">✈ AeroFlux</div>

  <nav>
    <a routerLink="/">Home</a>
    <a routerLink="/flights">Flights</a>
    
    <a routerLink="/support">Support</a>
  </nav>

</header>

<section class="auth-hero">

  <div class="auth-left">
    <div class="auth-card">

      <h2>Create Account</h2>
      <p class="subtitle">Join and start booking flights</p>

      <form [formGroup]="registerForm" (ngSubmit)="submit()">

        <label>Name</label>
        <input type="text" formControlName="name" placeholder="Your full name" />

        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />

        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Create a password" />

        <button type="submit" class="btn-primary full-width">
          Register
        </button>

      </form>

      <p class="switch-auth">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>

    </div>
  </div>

</section>
