<header class="navbar">
  <div class="logo">✈ AeroFlux</div>

  <nav>
    <a routerLink="/">Home</a>
    <a routerLink="/flights">Flights</a>
    <a routerLink="/support">Support</a>
  </nav>

</header>
<!-- AUTH HERO -->
<section class="auth-hero">

  <!-- LEFT SIDE (FORM) -->
  <div class="auth-left">
    <div class="auth-card">

      <h2>Welcome Back</h2>
      <p class="subtitle">Login to continue booking</p>

      <form [formGroup]="loginForm" (ngSubmit)="submit()">

        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="you@example.com"
        />

        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
        />

        <button
          type="submit"
          class="btn-primary full-width"
        >
          Login
        </button>

      </form>

      <p class="switch-auth">
        Don’t have an account?
        <a routerLink="/register">Register</a>
      </p>

    </div>
  </div>

</section>
