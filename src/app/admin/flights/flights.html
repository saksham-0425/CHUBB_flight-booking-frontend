<h2>All Flights</h2>

<!-- Loading state -->
<p *ngIf="loading">Loading flights...</p>

<!-- Error state -->
<p *ngIf="!loading && error" class="error">
  {{ error }}
</p>

<!-- Flights table -->
<table *ngIf="!loading && flights.length > 0">
  <thead>
    <tr>
      <th>Flight No</th>
      <th>Airline</th>
      <th>Source</th>
      <th>Destination</th>
      <th>Date</th>
      <th>Seats</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let f of flights">
      <td>{{ f.flightNumber }}</td>
      <td>{{ f.airline }}</td>
      <td>{{ f.source }}</td>
      <td>{{ f.destination }}</td>
      <td>{{ f.date }}</td>
      <td>{{ f.availableSeats }}</td>
      <td>
        <button class="edit-btn" (click)="editFlight(f.id)">
          Edit
        </button>
        <button class="delete-btn" (click)="openDeletePopup(f.id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Empty state -->
<p *ngIf="!loading && flights.length === 0 && !error">
  No flights available
</p>

<!-- 🔥 Confirmation Popup (OUTSIDE table) -->
<div class="confirm-backdrop" *ngIf="showConfirmPopup">
  <div class="confirm-box">
    <h3>Confirm Deletion</h3>
    <p>Are you sure you want to delete this flight?</p>

    <div class="confirm-actions">
      <button class="danger" (click)="confirmDelete()">
        Yes, Delete
      </button>
      <button class="secondary" (click)="cancelDelete()">
        Cancel
      </button>
    </div>
  </div>
</div>
