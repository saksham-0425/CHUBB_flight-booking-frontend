<div class="form-container">

  <div class="form-card">

    <h2>Edit Flight</h2>
    <p class="subtitle">Update flight details below</p>

    <!-- In-app message -->
    <div *ngIf="message" class="alert" [ngClass]="messageType">
      {{ message }}
    </div>

    <form [formGroup]="flightForm" (ngSubmit)="submit()">

      <div class="form-grid">

        <div class="form-group">
          <label>Flight Number</label>
          <input formControlName="flightNumber" />
          <small *ngIf="f['flightNumber'].touched && f['flightNumber'].invalid">
            Flight number is required
          </small>
        </div>

        <div class="form-group">
          <label>Airline</label>
          <input formControlName="airline" />
          <small *ngIf="f['airline'].touched && f['airline'].invalid">
            Airline is required
          </small>
        </div>

        <div class="form-group">
          <label>Source</label>
          <input formControlName="source" />
          <small *ngIf="f['source'].touched && f['source'].invalid">
            Minimum 3 characters required
          </small>
        </div>

        <div class="form-group">
          <label>Destination</label>
          <input formControlName="destination" />
          <small *ngIf="f['destination'].touched && f['destination'].invalid">
            Minimum 3 characters required
          </small>
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" formControlName="date" />
          <small *ngIf="f['date'].touched && f['date'].invalid">
            Please select a valid date
          </small>
        </div>

        <div class="form-group">
          <label>Available Seats</label>
          <input type="number" formControlName="availableSeats" />
          <small *ngIf="f['availableSeats'].touched && f['availableSeats'].invalid">
            Seats must be at least 1
          </small>
        </div>

      </div>

      <div class="actions">
        <button type="submit" [disabled]="submitting">
          {{ submitting ? 'Updating...' : 'Update Flight' }}
        </button>

        <button
  type="button"
  class="secondary"
  (click)="cancel()"
>
  Cancel
</button>

      </div>

    </form>

  </div>

</div>
