<div class="form-container">

  <div class="form-card">

    <h2>Add New Flight</h2>
    <p class="subtitle">Enter flight details below</p>

    <!-- In-app message -->
    <div *ngIf="message" class="alert" [ngClass]="messageType">
      {{ message }}
    </div>

    <form [formGroup]="flightForm" (ngSubmit)="submit()">

      <div class="form-grid">

        <div class="form-group">
          <label>Flight Number</label>
          <input
            type="text"
            formControlName="flightNumber"
            placeholder="AI-101"
          />
          <small *ngIf="f['flightNumber'].touched && f['flightNumber'].invalid">
  Flight number is required (uppercase & numbers)
</small>

        </div>

        <div class="form-group">
          <label>Airline</label>
          <input
            type="text"
            formControlName="airline"
            placeholder="Air India"
          />
         <small *ngIf="f['airline'].touched && f['airline'].invalid">
  Airline name is required
</small>
        </div>

        <div class="form-group">
          <label>Source</label>
          <input
            type="text"
            formControlName="source"
            placeholder="LKO"
          />
         <small *ngIf="f['source'].touched && f['source'].invalid">
  Minimum 3 characters required
</small>
        </div>

        <div class="form-group">
          <label>Destination</label>
          <input
            type="text"
            formControlName="destination"
            placeholder="HYD"
          />
          <small *ngIf="f['destination'].touched && f['destination'].invalid">
  Minimum 3 characters required
</small>
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" formControlName="date" />
          <small *ngIf="f['date'].touched && f['date'].invalid">
  Please select a valid date
</small>
        </div>

        <div class="form-group">
          <label>Available Seats</label>
          <input type="number" formControlName="availableSeats" />
         <small *ngIf="f['availableSeats'].touched && f['availableSeats'].invalid">
  Seats must be at least 1
</small>
        </div>

      </div>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Adding...' : 'Add Flight' }}
      </button>

    </form>

  </div>

</div>
